name: Integrate TelegramFX

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/integrate-telegramfx.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch telegram.js
        run: python scripts/integrate_telegramfx.py

      - name: Validate telegram.js
        run: node --check api/telegram.js

      - name: Commit integration
        run: |
          git config user.name "User Fx"
          git config user.email "234803878+usuario18fx@users.noreply.github.com"
          git rm .github/workflows/integrate-telegramfx.yml scripts/integrate_telegramfx.py
          git add api/telegram.js
          git commit -m "integrate TelegramFX access admin into telegram bot"
          git push origin main
