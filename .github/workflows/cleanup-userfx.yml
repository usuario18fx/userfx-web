name: USER FX cleanup

on:
  push:
    paths:
      - ".github/workflows/cleanup-userfx.yml"
      - "scripts/cleanup-userfx-2026-09.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Apply cleanup
        run: python scripts/cleanup-userfx-2026-09.py

      - name: USER FX format
        run: npm run format:fx

      - name: Build
        run: npm run build

      - name: Remove one-time cleanup files
        run: |
          rm -f scripts/cleanup-userfx-2026-09.py
          rm -f .github/workflows/cleanup-userfx.yml

      - name: Commit cleanup
        run: |
          git config user.name "USER FX Cleanup"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "refactor: unify and clean USER FX frontend"
          git push origin HEAD:main
