name: UserFX project cleanup

on:
  push:
    branches:
      - cleanup/unify-project
    paths:
      - scripts/project-cleanup.mjs
      - .github/workflows/project-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Clone cleanup branch
        run: |
          git clone --branch cleanup/unify-project --single-branch "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo

      - name: Install dependencies
        working-directory: repo
        run: npm ci

      - name: Unify project
        working-directory: repo
        run: node scripts/project-cleanup.mjs

      - name: Format TSX JSX CSS
        working-directory: repo
        run: node scripts/format-userfx.mjs

      - name: Build
        working-directory: repo
        run: npm run build

      - name: Remove one-time cleanup runner
        working-directory: repo
        run: |
          rm -f scripts/project-cleanup.mjs
          rm -f .github/workflows/project-cleanup.yml

      - name: Commit cleaned project
        working-directory: repo
        run: |
          git config user.name "userfx-cleanup"
          git config user.email "userfx-cleanup@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No cleanup changes to commit"
            exit 0
          fi
          git commit -m "refactor: unify project and remove patches"
          git push origin cleanup/unify-project
