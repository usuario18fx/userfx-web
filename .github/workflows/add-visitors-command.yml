name: Add visitors bot commands

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-visitors-command.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update telegram bot
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('api/telegram.js')
          text = path.read_text(encoding='utf-8')

          import_line = 'import { createClient } from "@supabase/supabase-js";\n'
          if import_line not in text:
              anchor = 'import crypto from "crypto";\n'
              if anchor not in text:
                  raise SystemExit('crypto import anchor not found')
              text = text.replace(anchor, anchor + import_line, 1)

          helper_marker = '// USER FX · VISITOR ADMIN HELPERS'
          if helper_marker not in text:
              helper = r'''
// USER FX · VISITOR ADMIN HELPERS
function getVisitorSupabase() {
  if (!SUPABASE_URL || !SUPABASE_SERVICE_ROLE_KEY) {
    throw new Error("Missing Supabase configuration");
  }

  if (!globalThis.__userfxVisitorAdminSupabase) {
    globalThis.__userfxVisitorAdminSupabase = createClient(SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, {
      auth: {
        persistSession: false,
        autoRefreshToken: false,
      },
    });
  }

  return globalThis.__userfxVisitorAdminSupabase;
}

function maskVisitorIp(value) {
  const ip = String(value || "").trim();
  if (!ip) return "—";

  if (/^\d{1,3}(?:\.\d{1,3}){3}$/.test(ip)) {
    const parts = ip.split(".");
    return `${parts[0]}.${parts[1]}.xxx.xxx`;
  }

  if (ip.includes(":")) {
    const parts = ip.split(":").filter(Boolean);
    return parts.length ? `${parts.slice(0, 2).join(":")}:…` : "—";
  }

  return "—";
}

function formatVisitorDate(value) {
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return "—";

  return new Intl.DateTimeFormat("en-CA", {
    timeZone: "America/Toronto",
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
    hour: "2-digit",
    minute: "2-digit",
    hour12: false,
  }).format(date);
}
'''
              anchor = '// ======================================================\n// REDIS\n// ======================================================'
              if anchor not in text:
                  raise SystemExit('redis section anchor not found')
              text = text.replace(anchor, helper + '\n' + anchor, 1)

          commands_marker = '//// USER FX · VISITOR ADMIN COMMANDS //'
          if commands_marker not in text:
              commands = r'''
//// USER FX · VISITOR ADMIN COMMANDS //
bot.command("visitors", async (ctx) => {
  if (!isAdmin(ctx)) {
    await ctx.reply("✘ ᴜɴᴀᴜᴛʜᴏʀɪᴢᴇᴅ.");
    return;
  }

  const argument = String(getCommandArg(ctx) || "").trim().toLowerCase();
  const showFullIp = argument === "full";
  const todayOnly = argument === "today";
  const requestedLimit = /^\d{1,2}$/.test(argument) ? Number(argument) : 10;
  const limit = Math.min(Math.max(requestedLimit, 1), 30);

  try {
    const supabase = getVisitorSupabase();
    let query = supabase
      .from("track_events")
      .select("created_at,event,ip,geo,telegram")
      .eq("event", "miniapp_open")
      .order("created_at", { ascending: false })
      .limit(todayOnly ? 20 : limit);

    if (todayOnly) {
      const now = new Date();
      const torontoDate = new Intl.DateTimeFormat("en-CA", {
        timeZone: "America/Toronto",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
      }).format(now);
      query = query.gte("created_at", `${torontoDate}T00:00:00-04:00`);
    }

    const { data, error } = await query;
    if (error) throw error;

    if (!data?.length) {
      await ctx.reply("📊 ɴᴏ ᴠɪꜱɪᴛᴏʀ ᴇᴠᴇɴᴛꜱ ꜰᴏᴜɴᴅ.");
      return;
    }

    const lines = ["USER FX · RECENT VISITORS", ""];

    data.forEach((row, index) => {
      const geo = row?.geo && typeof row.geo === "object" ? row.geo : {};
      const telegram = row?.telegram && typeof row.telegram === "object" ? row.telegram : {};
      const username = telegram?.username ? `@${telegram.username}` : telegram?.id ? `ID ${telegram.id}` : "Telegram visitor";
      const city = String(geo?.city || "—");
      const country = String(geo?.country || "—");
      const ip = showFullIp ? String(row?.ip || "—") : maskVisitorIp(row?.ip);

      lines.push(`${String(index + 1).padStart(2, "0")} · ${ip}`);
      lines.push(`${city}, ${country}`);
      lines.push(formatVisitorDate(row?.created_at));
      lines.push(username);
      lines.push("");
    });

    await ctx.reply(lines.join("\n"));
  } catch (error) {
    logger.error("VISITORS COMMAND ERROR", {
      message: error?.message || null,
      stack: error?.stack || null,
    });
    await ctx.reply("✘ ᴜɴᴀʙʟᴇ ᴛᴏ ʟᴏᴀᴅ ᴠɪꜱɪᴛᴏʀꜱ.");
  }
});

bot.command("visitorstats", async (ctx) => {
  if (!isAdmin(ctx)) {
    await ctx.reply("✘ ᴜɴᴀᴜᴛʜᴏʀɪᴢᴇᴅ.");
    return;
  }

  try {
    const supabase = getVisitorSupabase();
    const now = new Date();
    const torontoDate = new Intl.DateTimeFormat("en-CA", {
      timeZone: "America/Toronto",
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
    }).format(now);

    const [totalResult, todayResult] = await Promise.all([
      supabase.from("track_events").select("*", { count: "exact", head: true }).eq("event", "miniapp_open"),
      supabase.from("track_events").select("*", { count: "exact", head: true }).eq("event", "miniapp_open").gte("created_at", `${torontoDate}T00:00:00-04:00`),
    ]);

    if (totalResult.error) throw totalResult.error;
    if (todayResult.error) throw todayResult.error;

    await ctx.reply(
      `USER FX · VISITOR STATS\n\nTOTAL OPENS · ${totalResult.count ?? 0}\nTODAY · ${todayResult.count ?? 0}\n\n/visitors\n/visitors 20\n/visitors today\n/visitors full`,
    );
  } catch (error) {
    logger.error("VISITOR STATS COMMAND ERROR", {
      message: error?.message || null,
      stack: error?.stack || null,
    });
    await ctx.reply("✘ ᴜɴᴀʙʟᴇ ᴛᴏ ʟᴏᴀᴅ ᴠɪꜱɪᴛᴏʀ ꜱᴛᴀᴛꜱ.");
  }
});
'''
              anchor = '//// ADMIN BOT / MY ID  //'
              if anchor not in text:
                  raise SystemExit('admin command anchor not found')
              text = text.replace(anchor, commands + '\n' + anchor, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate syntax and build
        shell: bash
        run: |
          npm ci
          npm run build

      - name: Commit update
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "USER FX automation"
          git config user.email "actions@users.noreply.github.com"
          git add api/telegram.js
          git commit -m "Add admin visitor commands to Telegram bot"
          git push origin main
