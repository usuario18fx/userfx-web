name: Patch Channels

on:
  push:
    paths:
      - ".github/workflows/patch-channels.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: node .github/scripts/patch-channels.cjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/telegram.js
          git commit -m "fix: add inline channel access buttons"
          git push
