<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>𝐔sᴇʀ Ŧҳ — ᴋᴇᴇᴘ ɪᴛ ʟɪᴛ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="/ui-responsive-fixes.css" />
    <link rel="stylesheet" href="/member-access-ui.css" />
    <style>
      html,
      body,
      #root {
        min-height: 100%;
        background:
          linear-gradient(rgba(0, 0, 0, .36), rgba(0, 0, 0, .58)),
          url('/wallpaper1.png') center top / cover fixed no-repeat !important;
      }

      .vx,
      .vx-open {
        background:
          linear-gradient(rgba(0, 0, 0, .22), rgba(0, 0, 0, .48)),
          url('/wallpaper1.png') center top / cover no-repeat !important;
      }

      .smkl-access-button {
        margin-top: -64px !important;
      }

      .smkl-modal__backdrop {
        background:
          linear-gradient(rgba(0, 0, 0, .46), rgba(0, 0, 0, .72)),
          url('/wallpaper1.png') center / cover no-repeat !important;
      }

      .smkl-modal__stage {
        display: flex !important;
        flex-direction: column !important;
        align-items: center !important;
      }

      .smkl-modal__bubble {
        order: 1;
      }

      .smkl-robot {
        order: 2;
      }

      .smkl-panel {
        order: 3;
        width: 100%;
        background:
          linear-gradient(rgba(7, 7, 8, .72), rgba(7, 7, 8, .84)),
          url('/wallpaperModal.png') left center / cover no-repeat !important;
        backdrop-filter: blur(8px) !important;
        -webkit-backdrop-filter: blur(8px) !important;
      }

      .smkl-modal__brand {
        order: 4;
        padding: 0 !important;
        margin-top: 18px;
      }

      .smkl-modal__brand-line,
      .smkl-modal__brand-rose {
        display: none !important;
      }

      .smkl-modal__brand strong {
        font-size: .95rem !important;
        font-weight: 600 !important;
        letter-spacing: .48em !important;
        text-indent: .48em !important;
        color: rgba(255, 255, 255, .74) !important;
        background: none !important;
        -webkit-text-fill-color: currentColor !important;
        filter: none !important;
      }

      /*=============================================*/
      /* PLAN ACTIVO · BORDE VERDE                  */
      /*=============================================*/
      .smkl-plan-pill.is-active {
        box-shadow:
          0 0 0 2px #63ffd0 !important,
          0 0 18px #63ffd05c !important,
          0 7px 18px #00000050 !important;
      }

      /*=============================================*/
      /* INPUT DE PLAN · PREFIJO FIJO + 4 DÍGITOS   */
      /*=============================================*/
      .smkl-plan-access-field {
        position: relative !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        min-height: 64px !important;
        padding: 0 14px !important;
        overflow: visible !important;
      }

      .smkl-plan-code-shell {
        width: 100% !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        gap: 10px !important;
        pointer-events: none !important;
      }

      .smkl-plan-fixed-prefix {
        min-width: 76px !important;
        display: inline-flex !important;
        align-items: center !important;
        justify-content: center !important;
        color: #73ffd5 !important;
        opacity: 1 !important;
        font-family: "JetBrains Mono", ui-monospace, monospace !important;
        font-size: 1rem !important;
        font-weight: 900 !important;
        line-height: 1 !important;
        letter-spacing: .15em !important;
        text-shadow: 0 0 8px #63ffd055 !important;
      }

      .smkl-plan-code-separator {
        color: #6b9ba7 !important;
        font-family: "JetBrains Mono", ui-monospace, monospace !important;
        font-size: 1rem !important;
        font-weight: 800 !important;
      }

      .smkl-plan-code-digits {
        display: grid !important;
        grid-template-columns: repeat(4, 34px) !important;
        gap: 8px !important;
      }

      .smkl-plan-code-digit {
        width: 34px !important;
        height: 40px !important;
        display: grid !important;
        place-items: center !important;
        border: 1px solid #197dca !important;
        border-radius: 8px !important;
        background:
          linear-gradient(180deg, #102333 0%, #071018 100%) !important;
        box-shadow:
          inset 0 1px 0 #ffffff10,
          0 0 8px #138ee52c !important;
        color: #050807 !important;
        font-family: "JetBrains Mono", ui-monospace, monospace !important;
        font-size: .95rem !important;
        font-weight: 900 !important;
        line-height: 1 !important;
      }

      .smkl-plan-code-digit.is-filled {
        border-color: #8affdd !important;
        background:
          linear-gradient(180deg, #c4fff1 0%, #72ffd8 55%, #36dcb1 100%) !important;
        box-shadow:
          inset 0 1px 0 #ffffffcc,
          inset 0 -5px 10px #078c7040,
          0 0 9px #63ffd08c !important;
      }

      .smkl-plan-access-field > input {
        position: absolute !important;
        inset: 0 !important;
        width: 100% !important;
        height: 100% !important;
        padding: 0 !important;
        opacity: 0 !important;
        color: transparent !important;
        caret-color: transparent !important;
        cursor: text !important;
        z-index: 4 !important;
      }

      .smkl-plan-access-field:focus-within {
        border-color: #63ffd0 !important;
        box-shadow:
          inset 0 1px 0 #ffffff12,
          0 0 0 1px #63ffd070,
          0 0 18px #63ffd02f !important;
      }

      /*=============================================*/
      /* FRASES · TELEGRAM / SPECIAL CODE            */
      /* aparecen al pasar el cursor o enfocar       */
      /*=============================================*/
      .smkl-telegram-mode-btn::after,
      .smkl-special-code-fab__tip {
        position: absolute !important;
        right: calc(100% + 10px) !important;
        top: 50% !important;
        transform: translateY(-50%) !important;
        min-width: max-content !important;
        padding: 6px 9px !important;
        border: 1px solid #2a788a !important;
        border-radius: 7px !important;
        background: rgba(3, 10, 13, .96) !important;
        color: #a8ffe7 !important;
        box-shadow: 0 7px 16px #00000078 !important;
        font-family: "JetBrains Mono", ui-monospace, monospace !important;
        font-size: .54rem !important;
        font-weight: 800 !important;
        letter-spacing: .08em !important;
        line-height: 1 !important;
        white-space: nowrap !important;
        opacity: 0 !important;
        visibility: hidden !important;
        pointer-events: none !important;
        transition: opacity .18s ease, transform .18s ease !important;
        z-index: 90 !important;
      }

      .smkl-telegram-mode-btn::after {
        content: "TELEGRAM ACCESS" !important;
      }

      .smkl-telegram-mode-btn.is-active::after {
        content: "BACK TO PLANS" !important;
      }

      .smkl-telegram-mode-btn:hover::after,
      .smkl-telegram-mode-btn:focus-visible::after,
      .smkl-special-code-fab:hover .smkl-special-code-fab__tip,
      .smkl-special-code-fab:focus-visible .smkl-special-code-fab__tip {
        opacity: 1 !important;
        visibility: visible !important;
        transform: translateY(-50%) translateX(-2px) !important;
      }

      @media (max-width: 520px) {
        .smkl-access-button {
          margin-top: -88px !important;
        }

        .smkl-modal {
          padding: 12px 16px 28px !important;
        }

        .smkl-modal__stage {
          width: min(100%, 390px) !important;
        }

        .smkl-modal__brand {
          margin-top: 16px;
        }

        .smkl-plan-code-shell {
          gap: 7px !important;
        }

        .smkl-plan-fixed-prefix {
          min-width: 65px !important;
          font-size: .84rem !important;
        }

        .smkl-plan-code-digits {
          grid-template-columns: repeat(4, 30px) !important;
          gap: 6px !important;
        }

        .smkl-plan-code-digit {
          width: 30px !important;
          height: 37px !important;
          border-radius: 7px !important;
          font-size: .84rem !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
    <script src="/special-code-fab.js"></script>
    <script src="/member-access-ui.js"></script>
    <script>
      (() => {
        const PREFIXES = ["BSIC", "PRX0", "VIPX"];
        const VALID_CHAR = /^[A-HJ-NP-Z2-9]$/i;

        function getActivePrefix(stage) {
          const active = stage?.querySelector?.(".smkl-plan-pill.is-active");
          const text = String(active?.textContent || "").toUpperCase();

          if (text.includes("BASIC")) return "BSIC";
          if (text.includes("VIP")) return "VIPX";
          return "PRX0";
        }

        function getSuffix(value) {
          return String(value || "")
            .toUpperCase()
            .replace(/^(BSIC|PRX0|VIPX)-?/i, "")
            .replace(/[^A-HJ-NP-Z2-9]/g, "")
            .slice(0, 4);
        }

        function setReactInputValue(input, value) {
          const descriptor = Object.getOwnPropertyDescriptor(
            HTMLInputElement.prototype,
            "value",
          );

          descriptor?.set?.call(input, value);
          input.dispatchEvent(new Event("input", { bubbles: true }));
        }

        function enhancePlanInput(stage) {
          if (!stage) return;

          const field = stage.querySelector(".smkl-plan-access-field");
          const input = field?.querySelector?.("input");
          if (!field || !input) return;

          let shell = field.querySelector(".smkl-plan-code-shell");

          if (!shell) {
            shell = document.createElement("div");
            shell.className = "smkl-plan-code-shell";
            shell.innerHTML = `
              <span class="smkl-plan-fixed-prefix">PRX0</span>
              <span class="smkl-plan-code-separator">-</span>
              <span class="smkl-plan-code-digits">
                <span class="smkl-plan-code-digit"></span>
                <span class="smkl-plan-code-digit"></span>
                <span class="smkl-plan-code-digit"></span>
                <span class="smkl-plan-code-digit"></span>
              </span>`;
            field.insertBefore(shell, input);
          }

          const prefixNode = shell.querySelector(".smkl-plan-fixed-prefix");
          const digitNodes = Array.from(shell.querySelectorAll(".smkl-plan-code-digit"));

          const render = () => {
            const prefix = getActivePrefix(stage);
            const suffix = getSuffix(input.value);

            if (prefixNode.textContent !== prefix) {
              prefixNode.textContent = prefix;
            }

            digitNodes.forEach((node, index) => {
              const char = suffix[index] || "";
              node.textContent = char;
              node.classList.toggle("is-filled", Boolean(char));
            });

            const expected = `${prefix}-${suffix}`;
            if (input.value !== expected) {
              setReactInputValue(input, expected);
            }

            input.setAttribute("maxlength", "9");
            input.setAttribute(
              "aria-label",
              `${prefix} access code. Enter the last four characters.`,
            );
          };

          if (input.dataset.userfxPlanInput !== "1") {
            input.dataset.userfxPlanInput = "1";

            input.addEventListener("keydown", (event) => {
              const prefix = getActivePrefix(stage);
              let suffix = getSuffix(input.value);

              if (event.key === "Backspace") {
                event.preventDefault();
                suffix = suffix.slice(0, -1);
                setReactInputValue(input, `${prefix}-${suffix}`);
                render();
                return;
              }

              if (event.key === "Delete") {
                event.preventDefault();
                setReactInputValue(input, `${prefix}-`);
                render();
                return;
              }

              if (event.key.length === 1) {
                const char = event.key.toUpperCase();
                if (!VALID_CHAR.test(char)) {
                  event.preventDefault();
                  return;
                }

                event.preventDefault();
                if (suffix.length >= 4) return;
                suffix += char;
                setReactInputValue(input, `${prefix}-${suffix}`);
                render();
              }
            });

            input.addEventListener("paste", (event) => {
              event.preventDefault();
              const prefix = getActivePrefix(stage);
              const suffix = getSuffix(event.clipboardData?.getData("text") || "");
              setReactInputValue(input, `${prefix}-${suffix}`);
              render();
            });

            input.addEventListener("input", render);
            input.addEventListener("focus", render);
          }

          render();
        }

        let queued = false;

        const sync = () => {
          if (queued) return;
          queued = true;

          requestAnimationFrame(() => {
            queued = false;
            const stage = document.querySelector(".smkl-modal__stage");
            if (stage) enhancePlanInput(stage);
          });
        };

        const observer = new MutationObserver(sync);
        observer.observe(document.documentElement, {
          childList: true,
          subtree: true,
          attributes: true,
          attributeFilter: ["class"],
        });

        document.addEventListener("click", sync, true);
        document.addEventListener("focusin", sync, true);
        sync();
      })();
    </script>
  </body>
</html>
