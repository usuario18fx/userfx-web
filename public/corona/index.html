<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#070b12">
    <meta name="description"
      content="ROOM DARK — una corona azul que se transforma en miles de partículas. Una experiencia interactiva de FX.">
    <title>FX · ROOM DARK</title>
    <style>
        * { box-sizing: border-box }
        body {
            margin: 0;
            background: #070b12;
            color: #dee7f2;
            font: 14px Arial, sans-serif;
            overflow: hidden;
            height: 100dvh;
        }
        body:before {
            content: "";
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at 30% 37%, #25303b 0%, #121c27 28%, #080e16 60%, #04070c 100%);
            pointer-events: none;
        }
        body.no-vignette:before { background: #080e16 }
        .floor {
            position: absolute;
            inset: 52% 0 0;
            background: radial-gradient(ellipse at 28% 62%, #5e79901c, transparent 58%);
            pointer-events: none;
        }
        .shadow {
            position: absolute;
            width: 40vw;
            height: 9vh;
            left: 7%;
            top: 73%;
            border-radius: 50%;
            background: #0009;
            filter: blur(22px);
            transform: rotate(-7deg);
            pointer-events: none;
        }
        canvas {
            position: absolute;
            inset: 0;
            width: 100vw;
            height: 100dvh;
            display: block;
            touch-action: none;
            cursor: grab;
        }
        canvas:active { cursor: grabbing }
        header {
            position: absolute;
            top: 34px;
            left: 40px;
            right: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
        }
        .brand {
            font-size: 24px;
            font-style: italic;
            font-weight: 700;
            letter-spacing: -3px;
        }
        .edition, #status {
            font-size: 9px;
            letter-spacing: .21em;
            color: #8193a3;
        }
        .title {
            position: absolute;
            left: 59%;
            top: 43%;
            pointer-events: none;
            animation: arrive 1.8s ease both;
            z-index: 4;
        }
        .title small {
            display: block;
            color: #698bad;
            font-size: 9px;
            letter-spacing: .4em;
            margin-bottom: 3px;
        }
        h1 {
            font-size: clamp(28px, 4.3vw, 68px);
            font-weight: 200;
            letter-spacing: .13em;
            margin: 0;
            color: #c6d2df;
            line-height: 1.05;
        }
        .subtitle {
            font-size: clamp(11px, 1.1vw, 16px);
            letter-spacing: .65em;
            color: #5e7388;
            margin: 1px 0 17px 4px;
        }
        .line {
            width: 36px;
            height: 1px;
            background: #587d9b;
            margin: 28px 0;
        }
        .caption {
            font-size: 11px;
            line-height: 1.8;
            color: #718397;
            letter-spacing: .07em;
        }
        .controls {
            position: fixed;
            left: 24px;
            right: 175px;
            bottom: max(18px, env(safe-area-inset-bottom));
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            z-index: 5;
            padding-right: 0;
        }
        .controls > div {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            max-width: 100%;
        }
        button {
            font: 10px Arial, sans-serif;
            letter-spacing: .12em;
            text-transform: uppercase;
            background: transparent;
            border: 1px solid #50678070;
            color: #bccbdc;
            padding: 11px 13px;
            cursor: pointer;
            transition: background .2s, border-color .2s;
            margin: 0;
        }
        button:hover {
            background: #719cc01a;
            border-color: #85b4db;
        }
        button:focus-visible {
            outline: 2px solid #9bd0ff;
            outline-offset: 5px;
        }
        button:disabled {
            opacity: .45;
            cursor: not-allowed;
        }
        #reset {
            border-color: transparent;
            color: #6e8399;
        }
        .hint {
            font-size: 8px;
            line-height: 1.8;
            letter-spacing: .1em;
            color: #687d91;
            text-align: right;
            margin: 0;
            flex: 1;
            min-width: 180px;
        }
        #status {
            position: fixed;
            left: 24px;
            bottom: 110px;
            max-width: calc(100vw - 48px);
            font-size: 9px;
            line-height: 1.5;
        }
        @keyframes arrive {
            from { opacity: 0; transform: translateY(12px) }
            to   { opacity: 1; transform: none }
        }
        .enter-vault {
            display: inline-block;
            margin-top: 26px;
            padding: 15px 23px;
            border: 1px solid #85b4db80;
            background: #29435c30;
            color: #dcefff;
            pointer-events: auto;
            text-decoration: none;
            font: 11px Arial, sans-serif;
            letter-spacing: .2em;
            text-transform: uppercase;
            cursor: pointer;
        }
        .enter-vault:hover { background: #456c9140 }
        .enter-vault:focus-visible {
            outline: 2px solid #9bd0ff;
            outline-offset: 5px;
        }
        /* ⚡ RENDIMIENTO: se quitaron filter y mix-blend-mode de este canvas a pantalla completa.
           El brillo ahora va "horneado" en el color de cada partícula (ver BRILLO en el script 3). */
        #icon-particles {
            position: fixed;
            inset: 0;
            z-index: 3;
            pointer-events: none;
            cursor: default;
        }
        header .brand {
            visibility: hidden;
            width: 110px;
            height: 65px;
        }
        /* ============================================================================== */
        .fx-rosa {
            position: fixed;
            height: 1px;
            visibility: hidden;
            pointer-events: none;
        }
        .fx-suelo {
            position: fixed;
            left: 0;
            width: 0;
            height: 0;
            visibility: hidden;
            pointer-events: none;
        }
/* ======================================================== */
        /* AJUSTE ROSA ESCRITORIO: arriba y a la derecha del título ROOM */
        #fx-rosa-position {
            position: fixed;
            right: 12%;     /* MÁS PEQUEÑO = más a la derecha */
            top: 11%;       /* MÁS PEQUEÑO = más arriba */
            width: 270px;   /* Tamaño real de la rosa */
            transform: scale(1.70);
        }
/* ======================================================== */
/* ======================================================== */
           #fx-shared-floor {
            top: 76vh;       /* ← 🔧 60vh más arriba, 85vh más abajo */
        }
        /* AJUSTE LOGO USER FX: PNG CROMADO CON VOLUMEN VISUAL, DETRÁS DE LA CORONA */
        #userfx-logo {
            position: fixed;
            left: 10%;        /* mover horizontalmente */
            top: 19%;         /* mover verticalmente */
            width: 520px;     /* ancho */
            height: 330px;    /* alto */
            z-index: 1;
            pointer-events: none;
            user-select: none;
        }
        #userfx-logo img { display: block; width: 100%; height: 100%; object-fit: contain; object-position: center; filter: none; pointer-events: none }
        /* CORONA: por encima del logo sin perder rotación ni interacción */
        #c { position: absolute; z-index: 2; pointer-events: auto; touch-action: none }
/* CONTROL USER FX: arrastrar solamente en modo MOVER */
        /* CONTROL CIRCULAR: mismo lenguaje visual que el icono 3D de Paint */
        #move-userfx { position:fixed;left:26%;top:64%;z-index:10;width:62px;height:62px;padding:4px;border-radius:50%;display:grid;place-items:center;background:#eef2f8;border:2px solid #262c67;color:#262c67;touch-action:none;cursor:grab;box-shadow:0 6px 20px #0005;transform:translateX(-50%) }
        #move-userfx svg { display:block;width:44px;height:44px;pointer-events:none }
        #move-userfx[aria-pressed="true"] { background:#d9eaff;border-color:#4057b6;box-shadow:0 0 0 4px #769dff26 }
        /* GIRO REAL DEL GLB: sin mover la caja, sin deformar el PNG */
        #userfx-logo model-viewer { display:block;width:100%;height:100%;background:transparent;pointer-events:none }
        #userfx-logo img.logo-fallback { position:absolute;inset:0;width:100%;height:100%;object-fit:contain }
        #userfx-logo.model-ready img.logo-fallback { display:none }
        #move-userfx { touch-action:none }

        /* --- Responsive --- */
        @media (max-width: 700px), (max-aspect-ratio: 115/100) {
            header { left: 18px; right: 18px; top: 17px }
            .title {
                top: 62%;
                left: 0;
                width: 100%;
                text-align: center;
            }
            .title small,
            .line,
            .caption { display: none }
            h1 { font-size: clamp(29px, 9vw, 42px); letter-spacing: .2em }
            .subtitle {
                font-size: 10px;
                letter-spacing: .48em;
                margin: 2px 0 10px;
            }
            .enter-vault { margin-top: 13px; padding: 12px 20px }
            .shadow {
                left: 15%;
                width: 70vw;
                top: 57%;
                height: 6vh;
            }
            .controls {
                left: 12px;
                right: 110px;
                bottom: max(12px, env(safe-area-inset-bottom));
                justify-content: flex-start;
                max-height: 79px;
                overflow-y: auto;
            }
            .controls > div { justify-content: flex-start; gap: 4px }
            .controls button { font-size: 8px; padding: 8px 7px }
            .hint { display: none }
            #move-userfx { width:52px;height:52px;padding:4px } #move-userfx svg{width:37px;height:37px}
            #status {
                left: 12px;
                right: 12px;
                width: auto;
                max-width: calc(100% - 24px);
                bottom: 105px;
                text-align: center;
                font-size: 8px;
            }
            /* AJUSTE LOGO USER FX — MÓVIL */
            #userfx-logo { width: 90vw; height: 220px }
            /* AJUSTE ROSA MÓVIL: arriba del título, lado derecho */
            #fx-rosa-position {
                left: auto;
                right: 5%;
                top: 15%;
                width: 43vw;
                max-width: 190px;
                transform: none;
            }
            /* AJUSTE LOGO USER FX MÓVIL — DETRÁS DE LA CORONA */
            /* 🔧 AJUSTE SUELO — MÓVIL */
            #fx-shared-floor {
                top: calc(100dvh - 145px);  /* ← 🔧 altura del suelo en móvil */
            }
        }
        @media (max-height: 650px) {
            .controls { bottom: 12px }
            .hint { display: none }
            .controls button { padding: 9px 11px; font-size: 9px }
            #status { bottom: 72px }
            .title { top: 32% }
            .title .caption { margin: 12px 0 }
            .title .line { margin: 16px 0 }
            .enter-vault { margin-top: 12px; padding: 11px 16px }
            /* 🔧 AJUSTE SUELO — pantallas bajas */
            #fx-shared-floor {
                top: calc(100dvh - 100px);  /* ← 🔧 altura en pantallas bajas */
            }
        }
        @media (prefers-reduced-motion: reduce) {
            .title { animation: none }
            button, .enter-vault { transition: none }
        }
        /* AJUSTES DE TIPOGRAFÍA: etiqueta pegada a SECRET y DARK más arriba */
    .title small { margin-bottom: 3px }
    .title h1 { margin: 0 }
    .title .subtitle { margin-top: 1px }
    @media(max-width:700px) { .title .subtitle { margin-top: 1px } }
</style>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
</head>
<body>
    <div class="floor" aria-hidden="true"></div>
    <div class="shadow" aria-hidden="true"></div>
    <canvas
        id="c"
        tabindex="0"
        role="application"
        aria-label="Corona azul 3D interactiva. Arrastra para girarla; pulsa para dejar caer las partículas. Espacio para deshacer, Escape para restablecer."
    ></canvas>
    <!-- AJUSTE USER FX: imagen cromada original, sin partículas; ruta real public/corona/logo-3D.png -->
    <!-- El modelo se gira sobre X/Y/Z; el contenedor se mantiene fijo. -->
    <div id="userfx-logo" role="img" aria-label="USER FX, modelo tridimensional interactivo">
        <img class="logo-fallback" src="/corona/logo-3D.png" alt="USER FX" draggable="false">
        <model-viewer id="userfx-model"
            src="/corona/USER-FX-3D-REPARADO-FRONTAL.glb"
            camera-orbit="0deg 90deg 105%" field-of-view="26deg"
            orientation="0deg 0deg 0deg" loading="eager"
            shadow-intensity="0" exposure="1.2"
            interaction-prompt="none" disable-zoom
            alt="USER FX tridimensional">
        </model-viewer>
    </div>
    <header>
        <span class="brand" aria-hidden="true"></span>
        <span class="edition">INTERACTIVE EXPERIENCE / 01</span>
    </header>
    <main class="title">
        <small>FX · DIGITAL EXPERIMENT</small>
        <h1>ROOM</h1>
        <p class="subtitle">D A R K</p>
        <div class="line" aria-hidden="true"></div>
        <p class="caption">
            Una forma. Miles de posibilidades.
            <br>
            Todo vuelve a su origen.
        </p>
        <a class="enter-vault" id="enter-vault" href="/experience" target="_top">
            Entrar al vault ↗
        </a>
    </main>
    <span id="status" role="status" aria-live="polite">FORMANDO CORONA…</span>
    <div class="controls">
        <div>
            <button id="burst" type="button" aria-pressed="false">Deshacer corona</button>
            <button id="rose-burst" type="button">Deshacer rosa</button>
            <button id="reset" type="button">Restablecer</button>
        </div>
        <p class="hint">
            MUEVE EL MOUSE SOBRE LA ARENA · CLIC PARA REGENERAR
            <br>

    </div>
    <button id="move-userfx" type="button" aria-pressed="false" aria-label="Girar USER FX lateralmente" title="Arrastra horizontalmente para girar USER FX. Doble clic: restaurar orientación.">
        <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false"><circle cx="24" cy="24" r="22" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M13 21a12 12 0 0 1 22-5m0 0v-7m0 7h-7M35 27a12 12 0 0 1-22 5m0 0v7m0-7h7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M24 14v20m-7-10h14" stroke="currentColor" opacity=".65" stroke-width="1.5"/></svg>
    </button>
    <div class="fx-rosa" id="fx-rosa-position" aria-hidden="true"></div>
    <div class="fx-suelo" id="fx-shared-floor" aria-hidden="true"></div>
    <!-- ============================================================
         SCRIPT 1: SUELO COMPARTIDO + PANEL DE AJUSTES + PUENTE VAULT
         ============================================================ -->
    <script>
        (() => {
            'use strict';
            // SUELO ÚNICO: la rosa consulta la proyección del suelo WebGL de la corona.
            window.fxParticleFloor = () => ({
                y: window.fxCrownFloor?.(0.95) ?? innerHeight * .84,
                atDepth: () => window.fxCrownFloor?.(0.95) ?? innerHeight * .84,
                spread: 14
            });
            const enterVault = document.getElementById('enter-vault');
            enterVault?.addEventListener('click', (e) => {
                if (parent !== window) {
                    e.preventDefault();
                    parent.postMessage({ type: 'userfx:enter-vault' }, location.origin);
                }
            });
            /* FÍSICA PERMANENTE: valores elegidos en el panel anterior */
            const physics = { gravity: 10, radius: 28, force: 4, mouse: true };
            window.__fxPhysics = physics;
        })();
    </script>
    <!-- CONTROL USER FX: movimiento SOLO horizontal, sin cambiar altura ni rotación. -->
    <script>
        (() => {
            'use strict';
            const logo = document.getElementById('userfx-logo');
            const model = document.getElementById('userfx-model');
            const button = document.getElementById('move-userfx');
            const storageKey = 'userfx-room-posicion-horizontal-v1';
            const clamp = (n, min, max) => Math.min(max, Math.max(min, n));
            let offsetX = 0;
            let active = null;
            try {
                const stored = Number(localStorage.getItem(storageKey));
                if (Number.isFinite(stored)) offsetX = stored;
            } catch {}
            function locateControl() {
                const r = logo.getBoundingClientRect();
                button.style.left = clamp(r.left + r.width / 2, 32, innerWidth - 32) + 'px';
                button.style.top = clamp(r.bottom + 12, 15, innerHeight - 74) + 'px';
            }
            function apply() {
                logo.style.marginLeft = offsetX + 'px';
                locateControl();
            }
            function save() {
                try { localStorage.setItem(storageKey, String(offsetX)); } catch {}
            }
            if (model) {
                model.setAttribute('orientation','0deg 0deg 0deg');
                model.addEventListener('load', () => logo.classList.add('model-ready'));
                model.addEventListener('error', e => console.warn('USER FX GLB no disponible',e));
            }
            button.addEventListener('pointerdown', e => {
                if (e.button !== 0) return;
                e.preventDefault();
                active = { id:e.pointerId, x:e.clientX, start:offsetX };
                button.setPointerCapture(e.pointerId);
            });
            button.addEventListener('pointermove', e => {
                if (!active || e.pointerId !== active.id) return;
                // EJE HORIZONTAL ÚNICAMENTE: clientX, NUNCA clientY.
                offsetX = active.start + e.clientX - active.x;
                apply();
            });
            function release(e) {
                if (!active || e.pointerId !== active.id) return;
                active = null;
                save();
            }
            button.addEventListener('pointerup',release);
            button.addEventListener('pointercancel',release);
            button.addEventListener('dblclick',e => { e.preventDefault();offsetX=0;apply();save(); });
            button.addEventListener('keydown',e => {
                if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
                e.preventDefault();
                offsetX += e.key === 'ArrowLeft' ? -10 : 10;
                apply();save();
            });
            addEventListener('resize',locateControl,{passive:true});
            button.setAttribute('aria-label','Mover USER FX a izquierda y derecha');
            button.title='Arrastrar horizontalmente para mover USER FX. Doble clic para centrarlo.';
            apply();
        })();
    </script>
    <!-- ============================================================
         SCRIPT 2: CORONA 3D (WebGL)
         ============================================================ -->
    <script>
        (async () => {
            'use strict';
            const canvas = document.getElementById('c');
            const status = document.getElementById('status');
            const btn = document.getElementById('burst');
            // ⚡ antialias:false — los puntos ya salen suaves por el shader
            const gl = canvas.getContext('webgl', { alpha: true, antialias: false });
            if (!gl) {
                status.textContent = 'WebGL no disponible en este navegador.';
                canvas.style.display = 'none';
                return;
            }
            const CFG = {
                PROJ_DEPTH: 4.7,
                PROJECTION: 2.7,
                DEPTH_NEAR: 1.35,
                DEPTH_FAR: -4.4,
                FLOOR_Y: -1.12,        /* 🔧 AJUSTE SUELO 3D: altura física donde rebotan las partículas */
                FLOOR_SPREAD: 0.10,
                EDGE_X: 0.96,
                MAX_DT: 0.1,
                BURST_DURATION: 3.0,
                RETURN_EPS: 0.004,
                HIT_RADIUS_SQ: 196,
                SLEEP_MS: 5000,        /* ⚡ tras este tiempo quieta, la simulación se duerme */
                MAX_DPR: 1.5           /* ⚡ antes 2 */
            };
            const view = { w: innerWidth, h: innerHeight, aspect: innerWidth / innerHeight };
            function updateViewport() {
                view.w = innerWidth;
                view.h = innerHeight;
                view.aspect = view.w / view.h;
            }
            addEventListener('resize', updateViewport, { passive: true });
            const vs = `
                precision mediump float;
                attribute vec3 a;
                uniform float aspect;
                uniform float crownScale;
                uniform vec2 crownOffset;
                varying mediump float light;
                void main(){
                    float d = 4.7 - a.z;
                    float shift = aspect > 1.15 ? -.32 : 0.;
                    float shiftY = aspect > 1.15 ? 0. : .15;
                    gl_Position = vec4(
                        (a.x * 2.7 / aspect) * crownScale + (shift + crownOffset.x) * d,
                        (a.y * 2.7) * crownScale + (shiftY + crownOffset.y) * d,
                        d - .2,
                        d
                    );
                    gl_PointSize = clamp(7.5 / d, 1., 3.5);
                    light = clamp(.35 + (a.z + 1.5) * .28, 0., 1.);
                }
            `;
            const fs = `
                precision mediump float;
                varying mediump float light;
                void main(){
                    float r = length(gl_PointCoord - .5);
                    if (r > .5) discard;
                    gl_FragColor = vec4(
                        mix(vec3(.025,.10,.22), vec3(.25,.69,1.), light),
                        (.45 + light * .4) * (1. - r)
                    );
                }
            `;
            function shader(type, src) {
                const s = gl.createShader(type);
                gl.shaderSource(s, src);
                gl.compileShader(s);
                if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
                    throw new Error(gl.getShaderInfoLog(s));
                }
                return s;
            }
            const program = gl.createProgram();
            gl.attachShader(program, shader(gl.VERTEX_SHADER, vs));
            gl.attachShader(program, shader(gl.FRAGMENT_SHADER, fs));
            gl.linkProgram(program);
            if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
                throw new Error(gl.getProgramInfoLog(program));
            }
            gl.useProgram(program);
            let home;
            try {
                const response = await fetch('corona.bin');
                if (!response.ok) throw new Error('corona.bin no encontrado');
                const buf = await response.arrayBuffer();
                home = new Float32Array(buf);
                if (home.length === 0 || home.length % 3 !== 0) {
                    throw new Error('corona.bin con formato inválido');
                }
            } catch (err) {
                console.error(err);
                status.textContent = 'No se pudo cargar la corona 3D.';
                canvas.style.display = 'none';
                return;
            }
            const count = home.length / 3;
            const pos = new Float32Array(home.length);
            const vel = new Float32Array(home.length);
            const rest = new Float32Array(count);
            const buffer = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
            gl.bufferData(gl.ARRAY_BUFFER, pos, gl.DYNAMIC_DRAW);
            const attr = gl.getAttribLocation(program, 'a');
            gl.enableVertexAttribArray(attr);
            gl.vertexAttribPointer(attr, 3, gl.FLOAT, false, 0, 0);
            const aspectUniform = gl.getUniformLocation(program, 'aspect');
            const crownScaleUniform = gl.getUniformLocation(program, 'crownScale');
            const crownOffsetUniform = gl.getUniformLocation(program, 'crownOffset');
            gl.enable(gl.BLEND);
            gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
            gl.clearColor(0, 0, 0, 0);
            /* ===========================================================
               🔧 AJUSTE CORONA 3D — POSICIÓN Y TAMAÑO
               -----------------------------------------------------------
               scale = tamaño. 1 = original. .8 = más pequeña. 1.3 = grande.
               x     = horizontal. -1 = izquierda, 0 = centro, +1 = derecha.
               y     = vertical.   -1 = abajo,    0 = centro, +1 = arriba.
               =========================================================== */
            const coronaDesktop = {
                scale: 1.05,   /* ← 🔧 TAMAÑO en escritorio */
                x: -0.06,      /* ← 🔧 HORIZONTAL en escritorio */
                y: 0.03        /* ← 🔧 VERTICAL en escritorio */
            };
            const coronaMobile = {
                scale: 0.85,   /* ← 🔧 TAMAÑO en móvil */
                x: 0,          /* ← 🔧 HORIZONTAL en móvil */
