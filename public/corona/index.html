*{box-sizing:border-box}body{margin:0;background:#070b12;color:#dee7f2;font:14px Arial,sans-serif;overflow:hidden;height:100dvh}body:before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at 30% 37%,#25303b 0%,#121c27 28%,#080e16 60%,#04070c 100%);pointer-events:none}.floor{position:absolute;inset:52% 0 0;background:radial-gradient(ellipse at 28% 62%,#5e79901c,transparent 58%);pointer-events:none}.shadow{position:absolute;width:40vw;height:9vh;left:7%;top:73%;border-radius:50%;background:#0009;filter:blur(22px);transform:rotate(-7deg);pointer-events:none}canvas{position:absolute;inset:0;width:100vw;height:100dvh;display:block;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}header{position:absolute;top:34px;left:40px;right:40px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}.brand{font-size:24px;font-style:italic;font-weight:700;letter-spacing:-3px}.edition,#status{font-size:9px;letter-spacing:.21em;color:#8193a3}.title{position:absolute;left:59%;top:43%;pointer-events:none;animation:arrive 1.8s ease both}.title small{display:block;color:#698bad;font-size:9px;letter-spacing:.4em;margin-bottom:19px}h1{font-size:clamp(28px,4.3vw,68px);font-weight:200;letter-spacing:.13em;margin:0;color:#c6d2df;line-height:1.05}.subtitle{font-size:clamp(11px,1.1vw,16px);letter-spacing:.65em;color:#5e7388;margin:13px 0 24px 4px}.line{width:36px;height:1px;background:#587d9b;margin:28px 0}.caption{font-size:11px;line-height:1.8;color:#718397;letter-spacing:.07em}.controls{position:absolute;bottom:40px;left:40px;right:40px;display:flex;align-items:end;justify-content:space-between;gap:20px}button{font:10px Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;background:transparent;border:1px solid #50678070;color:#bccbdc;padding:13px 18px;cursor:pointer;transition:background .2s,border-color .2s}button:hover{background:#719cc01a;border-color:#85b4db}button:focus-visible{outline:2px solid #9bd0ff;outline-offset:5p </style></head><body><div class="floor"></div><div class="shadow"></div><canvas aria-label="Corona azul 3D. Arrastra para girarla; pulsa para dejar caer las partículas. Usa espacio para deshacer y Escape para restablecer." id="c" tabindex="0"></canvas><header><span class="brand">ƒx</span><span class="edition">INTERACTIVE EXPERIENCE / 01</span></header><main class="title"><small>FX · DIGITAL EXPERIMENT</small><h1>CORONA</h1><p class="subtitle">D A R K</p><div class="line"></div><p class="caption">Una forma. Miles de posibilidades.<br>Todo vuelve a su origen.</p><a class="enter-vault" id="enter-vault" href="../../#/vault" target="_top">Entrar al vault ↗</a></main><span id="status" role="status">FORMANDO CORONA…</span><div class="controls"><div><button id="burst" aria-pressed="false">Deshacer corona</button><button id="reset">Restablecer</button></div><p class="hint">ARRASTRA PARA GIRAR · PULSA PARA DESHACER<br>SCROLL PARA ACERCAR</p></div><script>
document.querySelector('#enter-vault').addEventListener('click',event=>{if(window.parent!==window){event.preventDefault();window.parent.postMessage({type:'userfx:enter-vault'},window.location.origin)}});
const canvas=document.querySelector('canvas'),status=document.querySelector('#status'),gl=canvas.getContext('webgl',{alpha:true,antialias:true});
async function main(){if(!gl)throw Error('Este navegador no permite WebGL.');
const vert=`precision highp float;attribute vec3 a;attribute vec3 scatter;uniform float time,burst,aspect,yaw,pitch,zoom,falling;varying mediump float light;void main(){
vec3 crown=a;float c=cos(yaw),s=sin(yaw);crown=vec3(c*crown.x+s*crown.z,crown.y,-s*crown.x+c*crown.z);c=cos(pitch);s=sin(pitch);crown=vec3(crown.x,c*crown.y-s*crown.z,s*crown.y+c*crown.z);crown.y+=sin(time*.7)*.025;
float delay=scatter.z*.24;float t=clamp((burst-delay)/(1.-delay),0.,1.);float blend=smoothstep(0.,1.,t);float radius=sqrt(scatter.x)*2.15;float angle=scatter.y*6.2831853;vec3 ground=vec3(cos(angle)*radius,-1.38+scatter.z*.025,sin(angle)*radius*.58);
vec3 p=mix(crown,ground,blend);if(falling>.5){p.y=mix(crown.y,ground.y,t*t);p.xz+=vec2(sin(angle),cos(angle))*sin(t*3.14159265)*.18;}else{p.xz+=vec2(sin(angle+t*3.),cos(angle+t*3.))*sin(t*3.14159265)*.16;}
float depth=4.7-p.z;float offset=aspect>1.15?-.32:0.;gl_Position=vec4(p.x*2.7*zoom/aspect+offset*depth,p.y*2.7*zoom+(aspect>1.15?0.:.15)*depth,depth-.2,depth);gl_PointSize=clamp(7.5/depth,1.,3.5);light=clamp(.35+(p.z+1.5)*.28+scatter.z*.25,0.,1.);}`;
const frag=`precision mediump float;varying mediump float light;uniform float burst;void main(){float r=length(gl_PointCoord-.5);if(r>.5)discard;gl_FragColor=vec4(mix(vec3(.025,.10,.22),vec3(.25,.69,1.),light),(.45+light*.4)*(1.-r)* (1.-burst*.13));}`;
function shader(type,src){let s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}const program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,vert));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,frag));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);
let response=await fetch('corona.bin');if(!response.ok)throw Error('No se pudo cargar la corona.');let points=new Float32Array(await response.arrayBuffer());let buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,points,gl.STATIC_DRAW);let attr=gl.getAttribLocation(program,'a');gl.enableVertexAttribArray(attr);gl.vertexAttribPointer(attr,3,gl.FLOAT,false,0,0);let randomState=7123;function random(){randomState=(Math.imul(randomState,1664525)+1013904223)>>>0;return randomState/4294967296}const scatter=new Float32Array(points.length);for(let i=0;i<scatter.length;i++)scatter[i]=random();const scatterBuffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,scatterBuffer);gl.bufferData(gl.ARRAY_BUFFER,scatter,gl.STATIC_DRAW);const scatterAttr=gl.getAttribLocation(program,'scatter');gl.enableVertexAttribArray(scatterAttr);gl.vertexAttribPointer(scatterAttr,3,gl.FLOAT,false,0,0);let uniforms={};for(let name of ['time','burst','aspect','yaw','pitch','zoom','falling'])uniforms[name]=gl.getUniformLocation(program,name);gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE);gl.clearColor(0,0,0,0);
const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;let zoom=1,yaw=-.2,pitch=.08,target=0,burst=reduced?0:1,falling=0,phase=reduced?'idle':'rising',hold=0,drag=false,moved=false,lastX=0,lastY=0;const btn=document.querySelector('#burst');function syncButton(){btn.textContent=phase==='falling'?'Juntar partículas':phase==='ground'?'Regenerar ahora':'Deshacer corona';btn.setAttribute('aria-pressed',String(phase==='falling'||phase==='ground'))}function toggle(){if(phase==='idle'||phase==='rising'){phase='falling';falling=1;target=1}else{phase='rising';falling=0;target=0}syncButton()}btn.onclick=toggle;document.querySelector('#reset').onclick=()=>{yaw=-.2;pitch=.08;zoom=1;target=0;falling=0;phase='rising';syncButton()};canvas.onpointerdown=e=>{drag=true;moved=false;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!drag)return;let x=e.clientX-lastX,y=e.clientY-lastY;if(Math.abs(x)+Math.abs(y)>2)moved=true;yaw+=x*.008;pitch=Math.max(-1.4,Math.min(1.4,pitch+y*.008));lastX=e.clientX;lastY=e.clientY};canvas.onpointerup=()=>{drag=false;if(!moved)toggle()};canvas.onpointercancel=()=>drag=false;status.textContent=new Intl.NumberFormat('es').format(points.length/3)+' PARTÍCULAS';canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.6,Math.min(1.5,zoom-e.deltaY*.0006))},{passive:false});document.addEventListener('keydown',e=>{if(e.target.tagName==='BUTTON')return;if(e.code==='Space'){e.preventDefault();toggle()}if(e.key==='Escape')document.querySelector('#reset').click()});let last=0;function frame(ms){let dt=Math.min((ms-last)/1000,.05);last=ms;const ratio=Math.min(devicePixelRatio,2),w=Math.round(innerWidth*ratio),h=Math.round(innerHeight*ratio);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;gl.viewport(0,0,w,h)}if(phase==='falling'){burst=Math.min(1,burst+dt/(reduced?.15:1.8));if(burst===1){phase='ground';hold=0;syncButton()}}else if(phase==='ground'){hold+=dt;if(hold>2.2){phase='rising';falling=0;target=0;syncButton()}}else if(phase==='rising'){burst=Math.max(0,burst-dt/(reduced?.15:3.6));if(burst===0){phase='idle';syncButton()}}gl.clear(gl.COLOR_BUFFER_BIT);for(let [name,value]of Object.entries({time:reduced?0:ms/1000,burst,aspect:w/h,yaw:yaw+(reduced||drag?0:Math.sin(ms*.00015)*.10),pitch,zoom,falling}))gl.uniform1f(uniforms[name],value);gl.drawArrays(gl.POINTS,0,points.length/3);requestAnimationFrame(frame)}requestAnimationFrame(frame)}main().catch(e=>{status.textContent=e.message;console.error(e)});
</script></html>
